name: task09-semantic-search

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: task09-postgres
    environment:
      POSTGRES_USER: internship
      POSTGRES_PASSWORD: internship
      POSTGRES_DB: task09
    ports:
      - "5439:5432"
    volumes:
      - task09-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship -d task09"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [task09-network]

  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: task09-postgres-test
    environment:
      POSTGRES_USER: internship
      POSTGRES_PASSWORD: internship
      POSTGRES_DB: task09_test
    ports:
      - "5449:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship -d task09_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [task09-network]

  redis:
    image: redis:8.2-alpine
    container_name: task09-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [task09-network]

volumes:
  task09-postgres-data:
    name: task09-postgres-data

networks:
  task09-network:
    name: task09-network
