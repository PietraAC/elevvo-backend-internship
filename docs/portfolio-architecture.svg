<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Elevvo Backend Internship architecture roadmap</title>
  <desc id="desc">A four-stage roadmap from relational persistence through semantic search and delivery to the final capstone.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07151f"/>
      <stop offset="1" stop-color="#102b35"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d36"/>
      <stop offset="1" stop-color="#0d2929"/>
    </linearGradient>
    <linearGradient id="planned" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2937"/>
      <stop offset="1" stop-color="#111c28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62d5ae"/>
    </marker>
  </defs>
  <rect width="1400" height="700" rx="32" fill="url(#background)"/>
  <circle cx="1240" cy="90" r="210" fill="#62d5ae" opacity=".05"/>
  <circle cx="110" cy="670" r="230" fill="#58a6ff" opacity=".05"/>

  <text x="70" y="82" fill="#f4fbf8" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="700">Backend Internship Architecture Roadmap</text>
  <text x="70" y="120" fill="#a8c5c2" font-family="Inter,Segoe UI,sans-serif" font-size="19">Four projects organized as one progressive engineering journey</text>

  <line x1="328" y1="330" x2="383" y2="330" stroke="#62d5ae" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="668" y1="330" x2="723" y2="330" stroke="#62d5ae" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1008" y1="330" x2="1063" y2="330" stroke="#62d5ae" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="55" y="175" width="275" height="330" rx="24" fill="url(#active)" stroke="#62d5ae" stroke-width="2"/>
    <rect x="395" y="175" width="275" height="330" rx="24" fill="url(#active)" stroke="#62d5ae" stroke-width="2"/>
    <rect x="735" y="175" width="275" height="330" rx="24" fill="url(#planned)" stroke="#516273" stroke-width="2"/>
    <rect x="1075" y="175" width="275" height="330" rx="24" fill="url(#planned)" stroke="#516273" stroke-width="2"/>
  </g>

  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="80" y="200" width="108" height="30" rx="15" fill="#62d5ae"/>
    <text x="134" y="221" text-anchor="middle" fill="#062019" font-size="14" font-weight="700">COMPLETED</text>
    <text x="80" y="278" fill="#f5fffb" font-size="24" font-weight="700">Task 05</text>
    <text x="80" y="311" fill="#cce5df" font-size="17">Relational Persistence</text>
    <text x="80" y="365" fill="#9dbbb6" font-size="16">Express · Prisma</text>
    <text x="80" y="392" fill="#9dbbb6" font-size="16">PostgreSQL · REST</text>
    <line x1="80" y1="424" x2="300" y2="424" stroke="#315b53"/>
    <text x="80" y="459" fill="#62d5ae" font-size="15" font-weight="600">DATA FOUNDATION</text>

    <rect x="420" y="200" width="108" height="30" rx="15" fill="#62d5ae"/>
    <text x="474" y="221" text-anchor="middle" fill="#062019" font-size="14" font-weight="700">COMPLETED</text>
    <text x="420" y="278" fill="#f5fffb" font-size="24" font-weight="700">Task 09</text>
    <text x="420" y="311" fill="#cce5df" font-size="17">Semantic Search</text>
    <text x="420" y="365" fill="#9dbbb6" font-size="16">Transformers.js · Redis</text>
    <text x="420" y="392" fill="#9dbbb6" font-size="16">pgvector · PostgreSQL</text>
    <line x1="420" y1="424" x2="640" y2="424" stroke="#315b53"/>
    <text x="420" y="459" fill="#62d5ae" font-size="15" font-weight="600">INTELLIGENCE LAYER</text>

    <rect x="760" y="200" width="82" height="30" rx="15" fill="#344457"/>
    <text x="801" y="221" text-anchor="middle" fill="#d6e1ec" font-size="14" font-weight="700">PLANNED</text>
    <text x="760" y="278" fill="#f5f8fc" font-size="24" font-weight="700">Task 07</text>
    <text x="760" y="311" fill="#cad5e0" font-size="17">Delivery Pipeline</text>
    <text x="760" y="365" fill="#91a3b5" font-size="16">Docker · CI/CD</text>
    <text x="760" y="392" fill="#91a3b5" font-size="16">Automated quality gates</text>
    <line x1="760" y1="424" x2="980" y2="424" stroke="#344457"/>
    <text x="760" y="459" fill="#91a3b5" font-size="15" font-weight="600">RELIABLE DELIVERY</text>

    <rect x="1100" y="200" width="82" height="30" rx="15" fill="#344457"/>
    <text x="1141" y="221" text-anchor="middle" fill="#d6e1ec" font-size="14" font-weight="700">PLANNED</text>
    <text x="1100" y="278" fill="#f5f8fc" font-size="24" font-weight="700">Task 10</text>
    <text x="1100" y="311" fill="#cad5e0" font-size="17">Backend Capstone</text>
    <text x="1100" y="365" fill="#91a3b5" font-size="16">Integrated services</text>
    <text x="1100" y="392" fill="#91a3b5" font-size="16">Production deployment</text>
    <line x1="1100" y1="424" x2="1320" y2="424" stroke="#344457"/>
    <text x="1100" y="459" fill="#91a3b5" font-size="15" font-weight="600">CAPSTONE</text>

    <rect x="55" y="565" width="1295" height="78" rx="20" fill="#081b24" stroke="#23404b"/>
    <text x="700" y="599" text-anchor="middle" fill="#a8c5c2" font-size="15" font-weight="600" letter-spacing="2">ENGINEERING PROGRESSION</text>
    <text x="700" y="627" text-anchor="middle" fill="#eef8f5" font-size="18">FOUNDATION  →  INTELLIGENCE  →  DELIVERY  →  CAPSTONE</text>
  </g>
</svg>
