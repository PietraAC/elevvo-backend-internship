services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: task05
      POSTGRES_USER: internship
      POSTGRES_PASSWORD: internship
    ports:
      - "5432:5432"
    volumes:
      - task05_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship -d task05"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: task05_test
      POSTGRES_USER: internship
      POSTGRES_PASSWORD: internship
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship -d task05_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  task05_postgres_data:
